<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fsc ~ terminal</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0e14;--tbg:#0f1319;--tbar:#151a22;
  --tx:#b3b9c5;--dim:#3d4455;--grn:#41d98c;--cyan:#53b8ff;
  --mag:#c778dd;--red:#e55561;--ylw:#e2b93d;--org:#e8804f;
  --brd:#1e2533;--acc:#3a86ff;
}
html{font-size:16px}
body{
  background:var(--bg);color:var(--tx);font-family:'JetBrains Mono',monospace;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:16px;overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 15% 50%,rgba(65,217,140,0.04) 0%,transparent 50%),
    radial-gradient(ellipse at 85% 30%,rgba(83,184,255,0.03) 0%,transparent 50%),
    linear-gradient(rgba(83,184,255,0.012) 1px,transparent 1px),
    linear-gradient(90deg,rgba(83,184,255,0.012) 1px,transparent 1px);
  background-size:100%,100%,22px 22px,22px 22px;
}

.lang-toggle{
  position:fixed;top:16px;right:16px;display:flex;align-items:center;gap:8px;
  background:var(--tbar);border:1px solid var(--brd);border-radius:20px;
  padding:5px 13px;cursor:pointer;z-index:100;
  font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--tx);transition:.3s;
}
.lang-toggle:hover{border-color:var(--cyan)}
.lang-dot{width:7px;height:7px;background:var(--grn);border-radius:50%}

.tw{
  width:100%;max-width:880px;background:var(--tbg);border-radius:12px;
  border:1px solid var(--brd);overflow:hidden;position:relative;z-index:1;
  box-shadow:0 0 0 1px rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.55),0 0 140px rgba(58,134,255,.03);
}

.tb{
  background:var(--tbar);padding:11px 16px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--brd);user-select:none;
}
.tb-dots{display:flex;gap:8px}
.tb-dot{width:13px;height:13px;border-radius:50%;cursor:pointer;transition:.2s}
.tb-dot:hover{opacity:.8}
.d-r{background:#ff5f57}.d-y{background:#febc2e}.d-g{background:#28c840}
.tb-t{font-size:.75rem;color:var(--dim);position:absolute;left:50%;transform:translateX(-50%)}
.tb-sc{display:flex;align-items:center;gap:10px;font-size:.72rem}
.sc-l{color:var(--dim)}.sc-v{color:var(--grn);font-weight:600;transition:color .3s}
.sc-bar{width:110px;height:5px;background:var(--brd);border-radius:3px;overflow:hidden}
.sc-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--grn));border-radius:3px;transition:width .8s cubic-bezier(.4,0,.2,1)}

.tbody{padding:26px 30px;min-height:500px;max-height:78vh;overflow-y:auto;scroll-behavior:smooth}
.tbody::-webkit-scrollbar{width:5px}
.tbody::-webkit-scrollbar-track{background:0 0}
.tbody::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px}

.logo{
  font-family:'Press Start 2P',monospace;color:var(--cyan);font-size:1.5rem;line-height:1.4;
  margin-bottom:12px;text-shadow:0 0 30px rgba(83,184,255,.22);letter-spacing:3px;
  white-space:pre;animation:gp 4s ease-in-out infinite;
}
@keyframes gp{0%,100%{text-shadow:0 0 20px rgba(83,184,255,.18)}50%{text-shadow:0 0 40px rgba(83,184,255,.35),0 0 80px rgba(83,184,255,.07)}}

.sub{color:var(--dim);font-size:.82rem;margin-bottom:3px}
.nav{color:var(--dim);font-size:.82rem;margin-bottom:22px}
.nav .ar{color:var(--grn)}
.nav a{color:var(--cyan);text-decoration:none;cursor:pointer;transition:.2s;border-bottom:1px solid transparent}
.nav a:hover{color:#7cc8ff;border-bottom-color:rgba(83,184,255,.3)}
.nav .sp{color:var(--dim);margin:0 3px}

#output{min-height:40px}

.line{margin-bottom:4px;font-size:.84rem;line-height:1.7;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.p{color:var(--grn);font-weight:600}
.c{color:var(--ylw);font-weight:500}

.il{display:flex;align-items:center;gap:0;margin-top:12px}
.ip{color:var(--grn);font-weight:600;white-space:pre}
.if{
  background:0 0;border:0;outline:0;color:var(--ylw);
  font-family:'JetBrains Mono',monospace;font-size:.86rem;font-weight:500;
  flex:1;caret-color:var(--grn);
}
.if::placeholder{color:var(--dim);opacity:.35}

.sec{margin:8px 0 16px 18px;animation:fi .35s ease}
.st{font-size:.86rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.ct{margin-left:2px;display:flex;flex-direction:column;gap:5px}
.cr{display:flex;gap:14px;font-size:.82rem;line-height:1.6}
.cn{color:var(--cyan);min-width:135px;font-weight:500}
.cd{color:var(--tx)}
.cp{color:var(--dim);font-size:.76rem}

.pc{margin-left:2px;border-left:2px solid var(--brd);padding-left:14px}
.pr{display:flex;gap:10px;font-size:.82rem;line-height:1.85}
.pk{color:var(--mag);min-width:125px;font-weight:500}
.pv{color:var(--tx)}
.pv a{color:var(--cyan);text-decoration:none}
.pv a:hover{text-decoration:underline}

.sg{margin-left:2px;margin-bottom:14px}
.sgt{color:var(--org);font-size:.82rem;font-weight:600;margin-bottom:7px}
.sts{display:flex;flex-wrap:wrap;gap:7px}
.sk{
  background:rgba(83,184,255,.07);border:1px solid rgba(83,184,255,.13);color:var(--cyan);
  padding:3px 10px;border-radius:4px;font-size:.74rem;transition:.3s;
}
.sk:hover{background:rgba(83,184,255,.14);border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 4px 10px rgba(83,184,255,.08)}
.sk.h{background:rgba(65,217,140,.08);border-color:rgba(65,217,140,.2);color:var(--grn)}
.sk.h:hover{background:rgba(65,217,140,.15);border-color:var(--grn);box-shadow:0 4px 10px rgba(65,217,140,.08)}

.tl{margin-left:2px;position:relative}
.tl::before{content:'';position:absolute;left:7px;top:5px;bottom:5px;width:2px;background:linear-gradient(180deg,var(--grn),var(--acc),var(--brd))}
.ti{position:relative;padding-left:30px;margin-bottom:18px}
.td{position:absolute;left:2px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--cyan);background:var(--tbg);transition:.3s}
.ti:first-child .td{background:var(--grn);border-color:var(--grn);box-shadow:0 0 8px rgba(65,217,140,.4)}
.ti:hover .td{border-color:var(--grn);box-shadow:0 0 8px rgba(65,217,140,.3)}
.t-dt{color:var(--ylw);font-size:.74rem;font-weight:600}
.t-tt{color:var(--tx);font-size:.82rem;font-weight:500}
.t-co{color:var(--mag);font-size:.78rem}
.t-ds{color:var(--dim);font-size:.74rem;margin-top:2px;line-height:1.45}

.pjc{
  margin-left:2px;margin-bottom:14px;padding:12px 14px;
  background:rgba(83,184,255,.03);border:1px solid var(--brd);border-radius:8px;transition:.3s;
}
.pjc:hover{border-color:rgba(83,184,255,.25);background:rgba(83,184,255,.05);transform:translateX(3px)}
.pjn{color:var(--cyan);font-size:.83rem;font-weight:600;margin-bottom:3px}
.pjn a{color:var(--cyan);text-decoration:none}
.pjn a:hover{text-decoration:underline}
.pjt{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:5px}
.pjtt{font-size:.66rem;background:rgba(199,120,221,.08);border:1px solid rgba(199,120,221,.18);color:var(--mag);padding:2px 7px;border-radius:3px}
.pjd{color:var(--dim);font-size:.76rem;line-height:1.45}

.cl{margin-left:2px;display:flex;flex-direction:column;gap:8px}
.clr{display:flex;align-items:center;gap:10px;font-size:.82rem}
.cli{font-size:1rem}
.cll{color:var(--mag);min-width:105px;font-weight:500}
.clv a{color:var(--cyan);text-decoration:none}
.clv a:hover{text-decoration:underline}

.nf-g{display:grid;grid-template-columns:auto 1fr;gap:0 20px;margin-left:2px;align-items:start}
.nf-a{color:var(--cyan);font-size:.55rem;line-height:1.1;white-space:pre;text-shadow:0 0 10px rgba(83,184,255,.18)}
.cb{display:flex;gap:3px;margin-top:8px}
.cbl{width:16px;height:16px;border-radius:3px;display:inline-block}

.tf{text-align:center;padding:7px;font-size:.66rem;color:var(--dim);border-top:1px solid var(--brd);background:var(--tbar)}

/* Matrix canvas */
#matrix{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;pointer-events:none;display:none}

/* Train animation */
.train-line{white-space:pre;font-size:.7rem;color:var(--grn);line-height:1.1;overflow:hidden}

/* Hack animation */
@keyframes scanline{0%{background-position:0 0}100%{background-position:0 100%}}

.hint{color:var(--dim);font-size:.68rem;margin-top:5px;opacity:.4}

@media(max-width:640px){
  body{padding:6px}
  .tbody{padding:14px}
  .logo{font-size:.95rem;letter-spacing:2px}
  .tb-t{font-size:.58rem}
  .cn{min-width:100px}
  .pk{min-width:90px}
  .tb-sc{display:none}
  .cr{flex-wrap:wrap}
  .nf-g{grid-template-columns:1fr}
}
</style>
</head>

let score=0;const mx=100;const earned=new Set();
const pts={help:3,whoami:7,skills:10,contact:5,experience:8,'git log':15,projects:15,neofetch:5,'cat motto.txt':2,socials:3,'cat about.txt':7,ls:2};
const hist=[];let hi=-1;

function addScore(c){
  if(pts[c]&&!earned.has(c)){earned.add(c);score+=pts[c];
  document.getElementById('scoreVal').textContent=score+'/'+mx;
  document.getElementById('scoreBar').style.width=((score/mx)*100)+'%';
  const e=document.getElementById('scoreVal');e.style.color='#fff';setTimeout(()=>e.style.color='',300)}
}

// ── Render helpers ──
const O=document.getElementById('output');
const B=document.getElementById('tbody');

function addLine(html,cls=''){
  const d=document.createElement('div');d.className='line '+(cls||'');d.innerHTML=html;O.appendChild(d);
  setTimeout(()=>B.scrollTop=B.scrollHeight,30);
}
function addBlock(html){
  const d=document.createElement('div');d.innerHTML=html;O.appendChild(d);
  setTimeout(()=>B.scrollTop=B.scrollHeight,30);
}
function addPrompt(cmd){
  addLine(`<span class="p">$ </span><span class="c">${cmd}</span>`);
}

// ── Matrix Rain ──
let matrixActive=false;
function startMatrix(){
  if(matrixActive)return;matrixActive=true;
  const c=document.getElementById('matrix');c.style.display='block';
  const ctx=c.getContext('2d');c.width=window.innerWidth;c.height=window.innerHeight;
  const cols=Math.floor(c.width/14);const drops=Array(cols).fill(1);
  const chars='アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン01';
  const iv=setInterval(()=>{
    ctx.fillStyle='rgba(10,14,20,0.06)';ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle='#41d98c';ctx.font='13px JetBrains Mono';
    for(let i=0;i<drops.length;i++){
      const t=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(t,i*14,drops[i]*14);
      if(drops[i]*14>c.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    }
  },33);
  setTimeout(()=>{clearInterval(iv);c.style.display='none';matrixActive=false;
    ctx.clearRect(0,0,c.width,c.height);},4000);
}

// ── Run ──
function run(raw){
  const cmd=raw.trim().toLowerCase();
  if(!cmd)return;
  hist.unshift(cmd);hi=-1;
  addPrompt(cmd);

  if(cmd==='clear'){O.innerHTML='';return}

  if(cmd==='matrix'){startMatrix();addLine('<span style="color:var(--grn)">Entering the Matrix... 🟢</span>');addScore('matrix');return}

  if(cmds[cmd]){addBlock(cmds[cmd]());addScore(cmd)}
  else if(eggs[cmd]){addBlock(eggs[cmd]());addScore(cmd)}
  else if(cmd.startsWith('echo ')){addLine(`<span style="color:var(--tx)">${cmd.slice(5)}</span>`)}
  else{
    let sug='';for(const c of Object.keys(cmds).concat(Object.keys(eggs))){if(c.startsWith(cmd.slice(0,3))){sug=c;break}}
    addLine(`<span style="color:var(--red)">zsh: command not found: ${cmd}</span>`);
    if(sug)addLine(`<span style="color:var(--dim)">Did you mean: <span style="color:var(--cyan)">${sug}</span>?</span>`);
    addLine(`<span style="color:var(--dim)">Type <span style="color:var(--cyan)">help</span> for available commands.</span>`);
  }
}

// ── Input ──
const inp=document.getElementById('cmd');
const allK=Object.keys(cmds).concat(Object.keys(eggs)).concat(['clear','matrix']);

inp.addEventListener('keydown',function(e){
  if(e.key==='Enter'){run(this.value);this.value=''}
  else if(e.key==='ArrowUp'){e.preventDefault();if(hi<hist.length-1){hi++;this.value=hist[hi]}}
  else if(e.key==='ArrowDown'){e.preventDefault();if(hi>0){hi--;this.value=hist[hi]}else{hi=-1;this.value=''}}
  else if(e.key==='Tab'){e.preventDefault();const v=this.value.toLowerCase();if(v){const m=allK.find(c=>c.startsWith(v));if(m)this.value=m}}
  else if(e.key==='l'&&e.ctrlKey){e.preventDefault();run('clear')}
});

document.getElementById('tbody').addEventListener('click',function(e){
  if(!e.target.closest('a'))inp.focus();
});
